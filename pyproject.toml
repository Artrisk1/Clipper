[project]
name = "youtube-clipper"
version = "1.0.0"
description = "Download only a specific time range of a YouTube video (yt-dlp + ffmpeg), via CLI or Streamlit."
readme = "README.md"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["network: hits the real YouTube API (opt-in via CLIPPER_NETWORK_TESTS=1)"]
addopts = "-ra"
